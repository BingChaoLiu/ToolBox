# config.example.yaml
# 复制为 config.yaml 并填写实际值

build:
  project_path: "D:/path/to/android/project"
  gradlew: "gradlew.bat"
  java_home: "C:/path/to/jdk"
  variants: [debug, release]
  flavors: [channel_a, channel_b]

git:
  repos:
    - name: "主项目"
      path: "D:/path/to/repo"
      branch: "main"
    - name: "模块A"
      path: "D:/path/to/module_a"
      branch: "dev"

addr2line:
  tool_path: "addr2line"
  default_so: "D:/path/to/libapp.so"
  so_files:
    - name: "libapp"
      path: "D:/path/to/libapp.so"
    - name: "libnative"
      path: "D:/path/to/libnative.so"

email:
  imap_server: "imap.qq.com"
  imap_port: 993
  account: "your_email@qq.com"
  auth_code: "your_auth_code"
  filter:
    from: ["bug-report@example.com"]
    subject_keywords: ["问题", "bug", "crash"]
  recent_count: 20

launcher_group:
  path: "D:/path/to/launcher/group"
  server:
    remote_name: "server"
    url_base: "http://user:pass@192.168.0.20:6789/RefactorLauncher/"
  url_patterns:
    - pattern: '^http://192\.168\.0\.20:6789'
      replacement: 'http://user:pass@112.91.80.106:23911'
    - pattern: '^http://112\.91\.80\.106:23911'
      replacement: 'http://user:pass@112.91.80.106:23911'
    - pattern: '^git@192\.168\.1\.232:'
      replacement: 'http://user:pass@112.91.80.106:23911/'

# UI 配置
ui:
  # 主题: dark (默认暗色) | light (亮色) | high-contrast (高对比度)
  theme: dark
