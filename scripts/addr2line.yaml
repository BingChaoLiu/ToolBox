name: 崩溃日志分析
description: 解析 Android Native 崩溃日志中的符号信息 (需要 .so/.elf 文件)
category: 调试

params:
  - name: crash_log
    label: 崩溃日志
    type: text
    multiline: true
    clipboard: true
    description: 直接粘贴 logcat 崩溃信息，自动提取 pc 地址

  - name: so_file
    label: SO 文件路径
    type: text
    description: 拖入或填入带符号表的 .so/.elf 文件路径

outputs:
  - results
