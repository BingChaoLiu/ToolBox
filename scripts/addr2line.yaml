name: 崩溃地址分析
description: 解析 native 崩溃地址对应的源码位置
category: 调试

params:
  - name: address
    label: 崩溃地址
    type: text
    multiline: true
    clipboard: true

  - name: so_file
    label: SO 文件
    type: choice
    options_from:
      source: config:addr2line.so_files
      label_field: name
      value_field: path

outputs:
  - results
